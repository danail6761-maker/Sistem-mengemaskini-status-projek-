<style>

/* Layout: kepala jalur atas + satu lajur kandungan; laporan sehalaman meniru susunan A4 asal (lajur gambar kiri, lajur status kanan). */
:root{

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --accent:#6aa8e6; --accent-fg:#0d1b2a; --accent-soft:#1f3347;
  --ok:#4cc27e; --ok-soft:#173826; --warn:#e2b23c; --warn-soft:#3a3016; --bad:#ec6a60; --bad-soft:#3e1d1b; --na:#a3afbb; --na-soft:#2a333d; color-scheme:dark }

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}

details.tetapan{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.tetapan summary{cursor:pointer;font-weight:600}

/* --- Laporan sehalaman --- */
.sheet{background:#fff;color:#111;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.18);max-width:880px;margin:0 auto;padding:18px;font-family:Calibri,"Carlito","Source Sans 3",Arial,sans-serif;font-size:14px;line-height:1.3}
.sheet .grid{display:grid;grid-template-columns:36% 1fr;gap:14px}

.sheet .info{border:3px solid #111;padding:10px 12px;font-weight:700;font-size:13.5px}
.sheet .info .t{margin-bottom:4px}
.sheet .info dl{display:grid;grid-template-columns:max-content 1fr;gap:1px 8px;margin:0}
.sheet .info dt::after{content:" :"} .sheet .info dd{margin:0;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.sheet .frame{border:3px solid #ed7d31;border-radius:28px;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}

.sheet .lamp.hijau{background:#00b050} .sheet .lamp.kuning{background:#ffc000} .sheet .lamp.merah{background:#e00000} .sheet .lamp.na,.sheet .lamp.batal{background:#a6a6a6}

.sheet .foot{margin-top:10px;font-family:Arial,sans-serif;font-weight:700;font-size:13px}

.reporthead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 14px}
.reporthead .grow{flex:1;min-width:200px}
.panel{max-width:880px;margin:22px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;color:var(--fg)}
.panel table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.panel th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}

.panel .scroll{overflow-x:auto}
.chart{margin:8px 0 14px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}

/* --- Borang --- */
.form{display:flex;flex-direction:column;gap:16px;max-width:920px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.hint{font-weight:400;font-size:12px;color:var(--muted)}
.calc{font-size:14px;font-weight:600;padding:8px 10px;border-radius:6px;background:var(--surface2);color:var(--fg)}
.byrows{display:flex;flex-direction:column;gap:8px}
.byrow{display:grid;grid-template-columns:150px 160px 1fr 1fr auto;gap:8px;align-items:end}

.imgcard{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface2)}
.imgcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--line)}
.imgcard .ph0{width:100%;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.stick{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:5}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:6px;font-weight:600}

@media (max-width:860px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<header class="top"><div class="wrap">
  <div class="brand"><b>Pengemaskini Status Perlaksanaan Projek Dibawah Peruntukan Pembangunan (P55)</b><span>Laporan Single Page · Jabatan Kerja Raya</span></div>

</div></header>
<main class="wrap" id="app">

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<script>
(function(){
"use strict";
const BULAN=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
const BLN3=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const PERINGKAT=["Perancangan","Reka Bentuk","Perolehan","Pembinaan","Tempoh Tanggungan Kecacatan","Siap","Batal"];
const PELAKSANAAN=["Belum Mula","Pra Pelaksanaan","Dalam Pelaksanaan","Siap","Batal"];
const PROGRAM={"41000":"Menaiktaraf Jalan Negeri","42000":"Membina Jalan Baharu","43000":"Mengganti Jambatan Negeri","44000":"Membaiki Persimpangan / Selekoh Merbahaya di Jalan Negeri","47000":"Kerja Ukur, Penyiasatan Tapak & Reka Bentuk Kejuruteraan & Kerja Awalan","49000":"Pelbagai Kajian"};
const STATUS={hijau:"Mengikut jadual",kuning:"Lewat",merah:"Projek sakit",na:"Belum dinilai",batal:"Batal"};
const LAMPU={hijau:"00B050",kuning:"FFC000",merah:"E00000",na:"A6A6A6",batal:"A6A6A6"};
const MONEY=["kos","kosKeseluruhan","perundingKos","peruntukan","tanggungan","belanja"];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0};
const has=v=>v!==""&&v!=null&&isFinite(parseFloat(String(v).replace(/,/g,"")));
const fmt2=v=>num(v).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const rm=v=>"RM "+fmt2(v);
const rmShort=v=>{const n=num(v);return n>=1e6?"RM "+(n/1e6).toLocaleString("en-MY",{maximumFractionDigits:2})+" juta":rm(n)};
const pct=v=>has(v)?(Math.round(num(v)*100)/100)+"%":"–";
const sgn=v=>(v>0?"+":"")+(Math.round(v*100)/100)+"%";
const moneyVal=v=>has(v)?fmt2(v):"";
function tarikh(iso,upper){if(!iso)return"–";const d=new Date(iso+"T00:00:00");if(isNaN(d))return iso;const s=d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear();return upper?s.toUpperCase():s}
function tarikhDot(iso){if(!iso)return"";const d=new Date(iso+"T00:00:00");if(isNaN(d))return iso;return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear()}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tempohMinggu(a,b){if(!a||!b)return"";const d=(new Date(b)-new Date(a))/864e5+1;return d>0?Math.round(d/7):""}
function lines(s){return String(s||"").split(/\r?\n/).map(x=>x.replace(/^\s*(\d+[.)]|[-•*])\s*/,"").trim()).filter(Boolean)}
function slug(s){return String(s||"").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)}
let LOCAL=false;
function imgSrc(im){
  if(!im)return"";
  if(im.url&&/^data:/.test(im.url))return im.url;
  if(im.id)return LOCAL?"img/"+im.id+".jpg":"/_blob/"+im.id;
  return im.url||"";
}
function baki(p){return num(p.peruntukan)-num(p.tanggungan)-num(p.belanja)}
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* Input wang: koma dimasukkan semasa menaip, 2 titik perpuluhan bila keluar */
function liveMoney(el){
  const old=el.value,pos=el.selectionStart==null?old.length:el.selectionStart;
  const before=old.slice(0,pos).replace(/[^0-9.]/g,"").length;
  let s=old.replace(/[^0-9.]/g,"");const i=s.indexOf(".");
  if(i>=0)s=s.slice(0,i+1)+s.slice(i+1).replace(/\./g,"").slice(0,2);
  let [a,b]=s.split(".");a=(a||"").replace(/^0+(?=\d)/,"");
  const nv=a.replace(/\B(?=(\d{3})+(?!\d))/g,",")+(b!==undefined?"."+b:"");
  if(nv===old)return;el.value=nv;
  let n=0,p=0;while(p<nv.length&&n<before){if(/[0-9.]/.test(nv[p]))n++;p++}
  try{el.setSelectionRange(p,p)}catch(e){}
}
function bindMoney(root){root.querySelectorAll("input.money").forEach(el=>{
  el.addEventListener("input",()=>liveMoney(el));
  el.addEventListener("blur",()=>{el.value=has(el.value)?fmt2(el.value):""});
})}

let db=null,user=null,assets=null,downloads=null;
let projects={},loaded=false,loadErr="",cfg={kuning:5,merah:20};
let names={},myId=null,canWrite=null;
let histUnsub=null,histRows=[],histFor=null;
let draft=null,q="",fPel="";

function statusOf(p){
  if(p.pelaksanaan==="Batal"||p.peringkat==="Batal")return"batal";
  if(p.statusManual&&STATUS[p.statusManual])return p.statusManual;
  if(!has(p.fizJadual)&&!has(p.fizSebenar))return"na";
  const b=num(p.fizSebenar)-num(p.fizJadual);
  if(b>=-num(cfg.kuning))return"hijau";
  if(b>=-num(cfg.merah))return"kuning";
  return"merah";
}

/* ---------- Routing ---------- */
function route(){
  const h=location.hash.replace(/^#/,"");
  if(histUnsub&&!h.startsWith("lihat-")){histUnsub();histUnsub=null;histFor=null}
  if(h.startsWith("lihat-"))return viewReport(h.slice(6));
  if(h.startsWith("kemaskini-"))return viewForm(h.slice(10));
  if(h==="baru")return viewForm(null);
  return viewList();
}

function renderHist(err){
  const el=$("#histBody");if(!el)return;
  if(err){el.textContent="Sejarah tidak dapat dibaca: "+err;return}

  if(!histRows.length){el.textContent="Belum ada sejarah. Setiap kali status disimpan, satu rekod ditambah di sini.";return}

  el.className="";
  el.innerHTML=chartSVG(rows)+`<div class="scroll"><table class="num"><thead><tr><th>Tarikh laporan</th><th>Fizikal jadual / sebenar</th><th>Beza</th><th class="r">Belanja (RM)</th><th class="r">Baki (RM)</th><th>Lampu</th><th>Oleh</th><th>Catatan</th></tr></thead><tbody>

  </tbody></table></div>`;
  fillNames();
}
function chartSVG(rows){
  if(rows.length<2)return"";
  const W=640,H=180,L=36,R=12,T=12,B=26,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(20,...rows.map(r=>Math.max(num(r.fizJadual),num(r.fizSebenar))));
  const top=Math.min(100,Math.ceil(mx/20)*20);
  const x=i=>L+i*iw/(rows.length-1),y=v=>T+ih-(Math.min(v,top)/top)*ih;
  const path=k=>rows.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(num(r[k])).toFixed(1)).join("");
  let g="";for(let v=0;v<=top;v+=top/4){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`}
  const step=Math.max(1,Math.ceil(rows.length/6));
  rows.forEach((r,i)=>{if(i%step===0||i===rows.length-1){const d=new Date((r.tarikhKemaskini||"")+"T00:00:00");g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===rows.length-1?"end":"middle"}">${isNaN(d)?"":BLN3[d.getMonth()]+" "+String(d.getFullYear()).slice(2)}</text>`}});
  const last=rows.length-1;
  return `<div class="chart"><div class="legend"><span><i style="background:var(--muted)"></i>Fizikal jadual</span><span><i style="background:var(--accent)"></i>Fizikal sebenar</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kemajuan fizikal jadual berbanding sebenar">${g}
  <path d="${path("fizJadual")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="${path("fizSebenar")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="${x(last)}" cy="${y(num(rows[last].fizSebenar))}" r="4" fill="var(--accent)"/></svg></div>`;
}
async function fillNames(){

}

function renderImgs(){
  const p=draft,box=$("#imgs");

    <b class="small">${label}</b>
    ${im&&imgSrc(im)?`<img src="${esc(imgSrc(im))}" alt="${label}">`:`<div class="ph0">${assets?"Tiada gambar":"Muat naik gambar memerlukan akses Editor/Contributor"}</div>`}

async function shrink(file,max){
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.85));
  }catch(e){return file}
}
async function upload(slot,file){
  if(!file)return;collect();
  const st=$("#st-"+slot);st.textContent="Memuat naik…";
  try{
    const blob=await shrink(file,slot==="peta"?1600:1400);
    const r=await assets.upload(blob);
    const im={id:r.id,url:r.url};
    if(slot==="peta")draft.peta=im;else{const i=+slot;const old=draft.gambar[i];im.kapsyen=old?old.kapsyen||"":"";if(i<draft.gambar.length)draft.gambar[i]=im;else draft.gambar.push(im)}
    renderImgs();toast("Gambar dimuat naik. Tekan Simpan untuk rekod.");
  }catch(e){st.textContent="Gagal: "+(e.message||e.code||e)}
}
function collect(){
  const p=draft;if(!p||!$("#frm"))return p;
  const v=k=>{const el=$("#f-"+k);return el?el.value.trim():p[k]};
  ["kod","program","kategori","pelaksanaan","noKontrak","pp","wpp","kontraktor","kos","kosKeseluruhan","perunding","perundingKos","tarikhMilik","tarikhSiap","daerah","parlimen","dun","fizJadual","fizSebenar","kewJadual","kewSebenar","tahunBelanja","peruntukan","tanggungan","belanja","tarikhKemaskini","peringkat","statusManual","nota"].forEach(k=>p[k]=v(k));
  p.tajuk=$("#f-tajuk").value.trim();p.catatan=$("#f-catatan").value.trim();
  p.tempoh=tempohMinggu(p.tarikhMilik,p.tarikhSiap);
  p.aktiviti=lines($("#f-aktiviti").value);p.isu=lines($("#f-isu").value);p.skop=lines($("#f-skop").value);
  p.bayaran=p.bayaran.map((r,i)=>$("#by-t-"+i)?Object.assign({},r,{tarikh:$("#by-t-"+i).value,amaun:$("#by-a-"+i).value,jenis:$("#by-j-"+i).value.trim(),catatan:$("#by-c-"+i).value.trim()}):r);
  p.gambar.forEach((g,i)=>{const c=$("#cap-"+i);if(c)g.kapsyen=c.value.trim()});
  return p;
}
async function save(id){
  const p=collect();
  if(!p.kod){toast("Sila isi kod projek.");$("#f-kod").focus();return}
  if(!p.tarikhKemaskini){toast("Sila isi tarikh kemaskini.");return}
  let docId=id;
  if(!docId){docId=slug(p.kod)||("P"+Date.now());if(projects[docId]){toast("Kod "+p.kod+" sudah wujud.");return}}
  const data={};
  Object.keys(p).forEach(k=>{if(k[0]!=="_"&&k!=="nota")data[k]=p[k]});
  MONEY.concat(["fizJadual","fizSebenar","kewJadual","kewSebenar","tempoh"]).forEach(k=>{data[k]=has(data[k])?num(data[k]):""});
  data.bayaran=p.bayaran.filter(r=>r.tarikh||has(r.amaun)||r.jenis).map(r=>({tarikh:r.tarikh||"",tahun:r.tahun||"",amaun:has(r.amaun)?num(r.amaun):0,jenis:r.jenis||"",catatan:r.catatan||""}));
  data.baki=baki(data);
  data.updatedAt=new Date().toISOString();
  if(myId)data.updatedBy=myId;
  const btn=$("#saveBtn");btn.disabled=true;btn.textContent="Menyimpan…";
  try{
    await db.doc("projects/"+docId).set(data);
    try{await db.collection("projects/"+docId+"/sejarah").add(Object.assign({},data,{nota:p.nota||"",savedAt:data.updatedAt}))}catch(e){}
    draft=null;toast("Disimpan");go("lihat-"+docId);
  }catch(e){
    btn.disabled=false;btn.textContent="Simpan";
    toast(e.code==="not_granted"?"Anda tiada kebenaran menyimpan. Minta akses Contributor.":"Tidak disimpan: "+(e.message||e.code));
  }
}

/* ---------- Mod tempatan (GitHub Pages / fail sendiri) ----------
   Bila sistem dibuka di luar claude.ai, data disimpan dalam pelayar (localStorage),
   dimulakan daripada data/seed.json, dan boleh dieksport/diimport sebagai fail JSON. */
const LKEY="p55-status-projek-v1";
function makeLocalDb(initial){
  let store=initial;const subs=new Set();
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const persist=()=>{try{localStorage.setItem(LKEY,JSON.stringify(store))}catch(e){toast("Storan pelayar penuh. Eksport data dan kecilkan gambar.")}subs.forEach(f=>f())};
  const snap=path=>({id:path.split("/").pop(),exists:path in store,data:()=>clone(store[path]),metadata:{fromCache:false,hasPendingWrites:false}});
  const listen=(f)=>{subs.add(f);setTimeout(f,0);return()=>subs.delete(f)};
  function doc(path){return{id:path.split("/").pop(),path,
    get:async()=>snap(path),
    set:async d=>{store[path]=clone(d);persist()},
    update:async d=>{store[path]=Object.assign(store[path]||{},clone(d));persist()},
    delete:async()=>{Object.keys(store).forEach(k=>{if(k===path||k.startsWith(path+"/"))delete store[k]});persist()},
    onSnapshot:next=>listen(()=>next(snap(path))),
    collection:c=>query(path+"/"+c)}}
  function query(coll,ord,lim){
    const run=()=>{const pre=coll+"/";let docs=Object.keys(store).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes("/")).map(snap);
      if(ord)docs.sort((a,b)=>{const x=a.data()[ord[0]],y=b.data()[ord[0]];return(x>y?1:x<y?-1:0)*(ord[1]==="desc"?-1:1)});
      if(lim)docs=docs.slice(0,lim);return{docs,size:docs.length,empty:!docs.length}};
    return{path:coll,orderBy:(f,d)=>query(coll,[f,d||"asc"],lim),limit:n=>query(coll,ord,n),get:async()=>run(),
      onSnapshot:next=>listen(()=>next(run())),doc:id=>doc(coll+"/"+(id||rid())),
      add:async d=>{const r=doc(coll+"/"+rid());await r.set(d);return r}}}
  return{doc,collection:c=>query(c),dump:()=>clone(store),load:s=>{store=clone(s);persist()}};
}
const localDownloads={save:async({filename,data})=>{
  const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));
  const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),10000);return{status:"saved"}}};
const localAssets={upload:async blob=>{const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});return{id:"",url,sizeBytes:blob.size,contentType:blob.type}}};
const localUser={id:async()=>"",can:async()=>true,profiles:async()=>({})};
async function startLocal(){
  LOCAL=true;
  let saved=null;try{saved=JSON.parse(localStorage.getItem(LKEY)||"null")}catch(e){}
  if(!saved){try{const r=await fetch("data/seed.json",{cache:"no-store"});saved=r.ok?(await r.json()).dokumen:{}}catch(e){saved={}}}
  db=makeLocalDb(saved||{});assets=localAssets;downloads=localDownloads;user=localUser;canWrite=true;
}
function localTools(){
  if(!LOCAL)return"";
  return `<button type="button" id="expBtn">Eksport data</button><label class="btn">Import data<input type="file" id="impIn" accept="application/json,.json" hidden></label>`;
}
function bindLocalTools(){
  if(!LOCAL)return;
  const e=$("#expBtn"),i=$("#impIn");
  if(e)e.onclick=()=>{const d=new Date();localDownloads.save({filename:"data-status-projek-"+today()+".json",data:new Blob([JSON.stringify({versi:1,dieksport:today(),dokumen:db.dump()},null,1)],{type:"application/json"})});toast("Data dieksport")};
  if(i)i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j||typeof j.dokumen!=="object")throw new Error("format");db.load(j.dokumen);toast("Data diimport")}catch(err){toast("Fail tidak sah. Pilih fail JSON yang dieksport daripada sistem ini.")}};
}

/* ---------- Mula ---------- */
async function start(){
  route();
  const use=window.claude&&window.claude.use;
  if(!use){
    await startLocal();
  }else{
    [db,user,assets,downloads]=await Promise.all(["db","user","assets","downloads"].map(n=>use(n).catch(()=>null)));
  }
  if(!db){loadErr="Pangkalan data tidak dapat dicapai. Pastikan anda log masuk ke claude.ai.";route();return}
  if(user){try{myId=await user.id()}catch(e){} try{canWrite=await user.can("data.write")}catch(e){}}
  const timer=setTimeout(()=>{if(!loaded){loadErr="Data lambat dimuatkan. Semak sambungan internet anda.";route()}},10000);
  db.doc("config/tetapan").onSnapshot(sn=>{const d=sn.exists&&sn.data();if(d)cfg={kuning:num(d.kuning),merah:num(d.merah)};if(loaded&&!$("#frm"))route()},()=>{});
  db.collection("projects").onSnapshot(sn=>{
    clearTimeout(timer);
    projects={};sn.docs.forEach(d=>{projects[d.id]=Object.assign({_id:d.id},d.data())});
    const first=!loaded;loaded=true;loadErr="";
    if(first||!$("#frm"))route();
  },e=>{clearTimeout(timer);loadErr="Data tidak dapat dibaca: "+(e.message||e.code);route()});
}
start();
})();
